<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Animated abstract wave texture</title>
  <desc id="desc">Layered flowing emerald, teal and violet wave lines with a soft luminous gradient.</desc>
  <defs>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="48%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animate attributeName="x1" values="0%;30%;0%" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;70%;100%" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55" stroke-width="13" opacity=".24" filter="url(#softGlow)">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55;M-30 82 C100 135 180 20 310 82 S520 135 650 82 S850 20 930 85;M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55"/>
    </path>
    <path d="M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55" stroke-width="2.5" opacity=".9">
      <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55;M-30 82 C100 135 180 20 310 82 S520 135 650 82 S850 20 930 85;M-30 62 C100 5 180 118 310 62 S520 5 650 62 S850 118 930 55"/>
    </path>
    <path d="M-30 105 C110 48 190 158 330 105 S550 48 690 105 S850 158 930 98" stroke-width="2" opacity=".55">
      <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M-30 105 C110 48 190 158 330 105 S550 48 690 105 S850 158 930 98;M-30 90 C110 150 190 38 330 90 S550 150 690 90 S850 38 930 105;M-30 105 C110 48 190 158 330 105 S550 48 690 105 S850 158 930 98"/>
    </path>
    <path d="M-30 30 C100 85 200 -10 330 30 S550 85 680 30 S850 -10 930 35" stroke-width="1.5" opacity=".35">
      <animate attributeName="d" dur="13s" repeatCount="indefinite" values="M-30 30 C100 85 200 -10 330 30 S550 85 680 30 S850 -10 930 35;M-30 45 C100 -15 200 95 330 45 S550 -15 680 45 S850 95 930 30;M-30 30 C100 85 200 -10 330 30 S550 85 680 30 S850 -10 930 35"/>
    </path>
  </g>
</svg>