<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
<title id="title">Flowing abstract waves</title>
<desc id="desc">Smooth layered teal, blue and violet waves flowing across a dark background.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071421"/>
    <stop offset="1" stop-color="#15152b"/>
  </linearGradient>
  <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f766e"/>
    <stop offset=".52" stop-color="#2563eb"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <linearGradient id="waveB" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#14b8a6"/>
    <stop offset=".55" stop-color="#3b82f6"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
